services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexuscrm}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexuscrm}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexuscrm}
      DATABASE_USER: ${POSTGRES_USER:-nexus}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      NEXUS_ENCRYPTION_KEY: ${NEXUS_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NEXUS_BFF_API_KEY: ${NEXUS_BFF_API_KEY:-change-me-bff-api-key}
      NEXUS_BFF_ORIGIN: http://bff:3001
      NEXUS_SEED: ${NEXUS_SEED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8088/bff/oauth/gmail/callback}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  bff:
    build:
      context: ./apps/bff
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3001
      API_BASE_URL: http://api:8080
      NEXUS_BFF_API_KEY: ${NEXUS_BFF_API_KEY:-change-me-bff-api-key}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8088/bff/oauth/gmail/callback}
    ports:
      - "3001:3001"

  web:
    build:
      context: ./apps/web
    depends_on:
      - bff
    ports:
      - "8088:80"

volumes:
  pgdata:
